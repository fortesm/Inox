schema: spec-driven

# Inox — OpenSpec configuration (adopted 2026-10-12, canon v3.48; the canon
# became the constitution at r3.61). Only Marcelo Fortes approves changes to
# the law. OpenSpec carries every change from proposal to approval,
# implementation and archive.
#
# Layout (r3.100): OpenSpec lives in docs/openspec, so docs/ is OpenSpec's
# project root: run every `openspec` command from docs/ (`cd docs && openspec
# validate --all --strict`). Rule texts are block scalars so that a `: ` inside
# them never breaks the YAML (an unquoted "Risk: high" once made OpenSpec
# ignore this whole file).

context: |
  Inox is a post-object-oriented, safety-first compiled language (C++20
  compiler, textual LLVM IR, Clang-backed driver, Linux and Windows/MSVC ABI).
  Law: docs/openspec/specs/constitution/spec.md and engineering.md (locked by
  constitution.lock; read them first), detailed by the capability specs in
  docs/openspec/specs/language and docs/openspec/specs/stdlib. Status:
  docs/STATUS.md. History: revisions.md, docs/history,
  docs/openspec/changes/archive. OpenSpec commands run from docs/.
  Authority: Marcelo Fortes is the sole design authority. A change to the law
  is accepted only when the proposal quotes his approval; agents may propose,
  never decide. Status follows the code; the law never follows the code. If
  two sources disagree, stop and report; never pick one silently.
  Non-negotiables: no classes/inheritance/null; `;` closes blocks; `End` is
  not a keyword; `==` comments; case-insensitive; `/` between integers is
  the integer division truncated toward zero, `mod` and `rem` as in Ada;
  overflow traps, never wraps; no empty parentheses; `leave`/`ensure`, never
  `break`/`finally`; generics use `<T>`; everything a module declares is
  private unless `Public` (CANON-3).
  Every language change updates code, tests, docs/site/index.html, the
  specs, a revision line in docs/openspec/specs/constitution/revisions.md,
  CHANGELOG.md and docs/grammar/grammar.ebnf when syntax changes. A change to
  constitution text relocks it: tools/constitution_check.py relock
  --approval <change>.
  Write artifacts in English; Marcelo's approval quotes stay in Portuguese.

rules:
  proposal:
    - >-
      State the constitution requirements (G/CANON anchors) and ADRs the
      change touches.
    - >-
      For a change to the law, quote Marcelo Fortes's approval with its date,
      or mark the proposal "Awaiting approval" and do not implement it.
    - >-
      State what is out of scope and which existing behavior must not change.
    - >-
      State the risk, `Risk: high` or `Risk: normal`. High when the change
      touches exception lowering, the runtime ABI, memory ownership, or
      rewrites a compiler phase; a high-risk change waits for Marcelo's dated
      approval of design.md before any code is written.
  specs:
    - >-
      Every scenario names the test that proves it (tests/... path) or says
      "test to add".
    - >-
      Requirements describe Inox programs and compiler diagnostics, never C++
      internals.
  design:
    - >-
      Describe the lowering to LLVM IR and the runtime faults involved.
    - >-
      For `Risk: high`, end with "Design approval:" and Marcelo's quote and
      date, or "Awaiting design approval".
  tasks:
    - >-
      End with the E19 gates (suite, ASan+UBSan with a 1 MiB stack, mutation
      fuzz seeds 1 and 7, backend_gaps 0 BUG, eh_state_balance,
      string_leak_check, grammar_consistency, openspec validate,
      constitution_check) and the documentation updates.
    - >-
      A refactor starts with `tools/ir_snapshot.py record` and its gates
      include `compare`, with every intended difference listed.

operations:
  archive:
    guidance:
      - >-
        Archive right after the pull request is merged, in the next branch, so
        docs/openspec/specs always matches main.
      - >-
        Add the revision line to docs/openspec/specs/constitution/revisions.md
        (and relock the constitution when its text changed).
      - >-
        Record the final test counts and gate results in the archived change.
