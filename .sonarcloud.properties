# SonarQube Cloud automatic analysis for Inox.
# This is NOT sonar-project.properties: no SonarScanner GitHub Actions job is used.
# See docs/SONARQUBE_CLOUD.md before enabling the integration.

# Analyze the C++ compiler, runtime, public headers and supporting Python tools.
# C++ unit-test sources are intentionally outside the first analysis scope;
# the existing E19 test and sanitizer gates remain responsible for validation.
sonar.sources=src,include,tools
sonar.sourceEncoding=UTF-8

# Inox is compiled as C++20 (cmake/InoxCompilerOptions.cmake).
sonar.cfamily.reportingCppStandardOverride=c++20
