# SPDX-License-Identifier: MPL-2.0
# Probe: build the Inox compiler itself with Microsoft's cl.exe (MSVC) instead of
# clang++, then run the PowerShell suite. Temporary branch-only workflow.
name: MSVC cl.exe probe

on:
  push:
    branches: [ci-msvc-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows (cl.exe builds the compiler)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Developer environment (MSVC x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Toolchain versions
        shell: pwsh
        run: |
          cl 2>&1 | Select-Object -First 1
          clang --version | Select-Object -First 1
      - name: Configure (cl.exe)
        run: cmake -S . -B build/msvc -G "Ninja Multi-Config" -DCMAKE_CXX_COMPILER=cl
      - name: Build (cl.exe, /W4 /permissive-)
        shell: pwsh
        run: |
          cmake --build build/msvc --config Debug --clean-first *>&1 | Tee-Object -FilePath build-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $id = (Select-String -Path build/msvc/CMakeCache.txt -Pattern '^CMAKE_CXX_COMPILER:' ).Line
          $ver = (cl 2>&1 | Select-Object -First 1)
          $warnings = @(Select-String -Path build-output.txt -Pattern 'warning C\d+' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique)
          $units = @(Select-String -Path build-output.txt -Pattern '\.cpp').Count
          Write-Output "::notice::compiler: $ver | $id | build lines mentioning .cpp: $units | distinct MSVC warnings: $($warnings.Count)"
          foreach ($w in $warnings | Select-Object -First 20) { Write-Output "::notice::$w" }
      - name: Test suite (known EH-v3.16a failures must match exactly)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -InoxExe build/msvc/Debug/inox.exe *>&1 | Tee-Object -FilePath test-output.txt
          python tools/ci_known_failures.py test-output.txt ci/windows-known-failures.txt
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-test-output
          path: test-output.txt
