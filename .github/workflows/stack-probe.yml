# TEMPORARY (change source-positions): measures, on Windows Debug, the
# smallest stack reserve with which the boundary tests pass, for the
# compiler of main and of this branch. Removed before merge.
name: Stack probe

on:
  pull_request:
    paths:
      - .github/workflows/stack-probe.yml
      - src/**

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build head and base (Debug)
        shell: pwsh
        run: |
          cmake --preset windows-clang-msvc
          cmake --build --preset windows-clang-msvc-debug --target inox
          git worktree add ..\base ${{ github.event.pull_request.base.sha }}
          Push-Location ..\base
          cmake --preset windows-clang-msvc
          cmake --build --preset windows-clang-msvc-debug --target inox
          Pop-Location
      - name: Smallest stack reserve that passes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $env:INOX_STDLIB = (Resolve-Path stdlib).Path
          function Probe($exe, $file, $mode) {
            $lo = 256KB; $hi = 4MB
            while ($hi - $lo -gt 8KB) {
              $mid = [int](($lo + $hi) / 2)
              $copy = Join-Path $env:RUNNER_TEMP ("probe-" + [guid]::NewGuid() + ".exe")
              Copy-Item $exe $copy
              editbin /nologo /STACK:$mid $copy | Out-Null
              & $copy $mode $file 2>&1 | Out-Null
              $ok = ($LASTEXITCODE -eq 0)
              Remove-Item $copy
              if ($ok) { $hi = $mid } else { $lo = $mid }
            }
            return [int]($hi / 1KB)
          }
          foreach ($pair in @(@("tests\runtime\limits-boundary-ok.inox", "--emit-llvm"), @("tests\parser\valid\limits-boundary-ok.inox", "--emit-llvm"), @("tests\parser\valid\limits-boundary-ok.inox", "--parse-only"))) {
            $file = (Resolve-Path $pair[0]).Path
            $headExe = (Resolve-Path build\windows-clang-msvc\Debug\inox.exe).Path
            $baseExe = (Resolve-Path ..\base\build\windows-clang-msvc\Debug\inox.exe).Path
            $h = Probe $headExe $file $pair[1]
            $b = Probe $baseExe $file $pair[1]
            Write-Output ("::warning::{0} {1}: base {2} KiB, head {3} KiB" -f $pair[0], $pair[1], $b, $h)
          }
          exit 0
