# SPDX-License-Identifier: MPL-2.0
# Build and test Inox on every pull request and on main.
# Linux must pass the full suite. Windows (MSVC ABI) must not fail any test
# outside ci/windows-known-failures.txt (the EH-v3.16a exception tests until the
# MSVC exception bridge lands).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (clang, Debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build
          clang --version
      - name: Configure
        run: cmake --preset linux-clang-debug
      - name: Build
        run: cmake --build --preset linux-clang-debug
      - name: Test suite
        run: bash scripts/run-tests.sh build/linux-clang-debug/inox
      - name: Backend gaps (0 BUG, emitted IR checked by clang)
        run: python3 tools/backend_gaps.py build/linux-clang-debug/inox
      - name: Exception state lifetime (every captured state released)
        run: python3 tools/eh_state_balance.py build/linux-clang-debug/inox

  windows:
    name: Windows (clang, MSVC ABI, Debug)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Developer environment (MSVC x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Toolchain versions
        shell: pwsh
        run: |
          clang --version
          cmake --version
          ninja --version
      - name: Configure
        run: cmake --preset windows-clang-msvc
      - name: Build
        run: cmake --build --preset windows-clang-msvc-debug
      - name: Test suite (known EH-v3.16a failures tolerated)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -InoxExe build/windows-clang-msvc/Debug/inox.exe *>&1 | Tee-Object -FilePath test-output.txt
          python tools/ci_known_failures.py test-output.txt ci/windows-known-failures.txt
      - name: Failure details as an annotation
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test-output.txt) {
            $blocks = Select-String -Path test-output.txt -Pattern '\[FAIL\]' -Context 0,12 |
              ForEach-Object { (@($_.Line) + $_.Context.PostContext) -join ' | ' }
            if ($blocks) {
              $text = ($blocks -join '%0A') -replace '\r', ''
              if ($text.Length -gt 60000) { $text = $text.Substring(0, 60000) }
              Write-Host "::warning title=Windows test failures::$text"
            }
          }
      - name: MSVC EH bridge acceptance criteria (i)-(v)
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-windows-eh-poc.ps1 -InoxExe build/windows-clang-msvc/Debug/inox.exe *>&1 | Tee-Object -FilePath eh-poc-output.txt
          $code = $LASTEXITCODE
          $text = ((Get-Content eh-poc-output.txt -Raw) -replace "`r", "") -replace "`n", "%0A"
          Write-Host "::warning title=MSVC EH PoC output::$text"
          exit $code
      - name: Backend gaps (0 BUG)
        run: python tools/backend_gaps.py build/windows-clang-msvc/Debug/inox.exe
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: test-output.txt
